services:
  qoder-proxy:
    # 本 fork 的镜像：由 .github/workflows/docker-publish.yml 在打 v* tag 时构建并
    # 推送多架构 amd64/arm64 到 GHCR（仓库名即 fork 名）。
    # 还没有发布镜像时（或想从源码构建）：注释掉下面这行 image，启用 build: .
    image: ghcr.io/lx2000wasd/qoder2api-hub:latest
    # build: .
    container_name: qoder-proxy
    restart: unless-stopped
    # 固定网卡 MAC（**可选，默认关闭**）：bridge 网络下容器停止会重建 veth，设备身份随之变化。
    # 但 v1.2.13 起网关默认启用「机器身份落盘缓存」：只要 accounts/ 是挂载卷，
    # **重启 / 重建 / 升级都不会再换设备身份** —— 所以通常**不需要**这一行。
    # 只在「不挂载 accounts/」或「希望组件调用本身也稳定」时才需要固定它。
    # ⚠️ 要用的话请换成你自己生成的，别照抄——macvlan / 同一宿主机多实例会撞 MAC：
    #    printf '02:42:%02x:%02x:%02x:%02x\n' $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256)) $((RANDOM%256))
    # mac_address: "02:42:ac:11:00:77"
    # 固定主机名（**可选**）：签到请求的 Cosy-MachineHostname 与官方桌面端一样取本机
    # hostname，容器默认是容器 ID，每次重建都会变。想固定就填一个**你自己的**名字，
    # 别照抄示例（所有人用同一个名字反而成了共同指纹）。
    # hostname: my-nas
    ports:
      # 宿主机:容器。改容器监听端口时 PORT 与这里要一起改。
      # ⚠️ 只发布到宿主机回环（H1，docs/plan/07-docker-auth.md）：容器内仍监听
      # 0.0.0.0（--lan 语义），对外入口是 nginx TLS(45421) → 宿主
      # 127.0.0.1:8790 → 容器。写成 "8790:8790" 会把网关连同面板直接发布到
      # 所有网卡（上游 v1.7.0 的默认值，本 fork 不跟随）。
      - "127.0.0.1:8790:8790"
    # API Key 用 0600 的 env_file 注入（H2），不要把 Key 写进本文件的明文
    # environment —— 这个文件通常会提交进 git：
    #     install -m 600 /dev/null qoder.env && printf 'API_KEY=%s\n' '<key>' > qoder.env
    # compose >= 2.24 可加 required: false 让文件缺失时也能启动；旧版 compose
    # 对缺失的 env_file 会直接报错，因此这里默认注释掉。
    # env_file:
    #   - ./qoder.env
    environment:
      # HOST/PORT 真实生效：镜像 CMD 不再硬编码 --host/--port（argparse 读环境变量）
      - HOST=0.0.0.0
      - PORT=8790
      # API_KEY 留空 = 容器以 --lan 启动，首次自动生成随机 Key 写入
      # ./accounts/settings.json（0600）。启动日志只打印**掩码**
      # （qd-****************abc）：登录面板到设置页复制，或显式设
      # QD_LOG_SENSITIVE=1 恢复上游那种完整 Key。
      # 生产请改用上面的 env_file（0600）注入，不要写在这里。
      # - API_KEY=your_api_key_here
      # 本 fork 默认禁用「一键更新」（REPO 指向 fork；上游 tarball 会覆盖本地补丁）
      - QD_UPDATE_DISABLE=1
      # H4：默认面板密码 'admin' 时拒绝启动（面板跟端口一起暴露 = 账号池失守）。
      # 首次部署先写面板密码，再 up -d：
      #   docker compose run --rm qoder-proxy python -c \
      #     "import qoder_settings; qoder_settings.set_panel_password('/app/accounts', '<新密码>')"
      # 或者启动时带 --panel-password <新密码>。个人本机用法可改回 0（= 上游行为）。
      - QD_REQUIRE_PANEL_PASSWORD=1
      - TZ=Asia/Shanghai
    volumes:
      # 持久化挂载账号凭证与用量流水
      # NAS / 长期部署建议改成绝对路径，避免源码目录被重装覆盖时连数据一起删掉
      - ./accounts:/app/accounts
      - ./usage:/app/usage
    # 资源上限：网关常态占用远低于 1G/2 核，超限被 OOM 杀掉好过把宿主机拖垮。
    mem_limit: 1g
    cpus: "2"
    # 日志体积防线：json-file 单文件 10MB、保留 3 个滚动文件。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # ⚠️ 权限：镜像内以非 root 运行（uid 10001，见 Dockerfile）。上面两个是 bind
    # 挂载，宿主机目录默认属于你的账号（uid 一般是 1000），首次启动前执行一次：
    #     sudo chown -R 10001:10001 ./accounts ./usage
    # 不想 chown 也可以在这里加 user: "1000:1000" 覆盖（放弃非 root 收益）。
    healthcheck:
      # 跟随 PORT 环境变量（与镜像内 HEALTHCHECK 同语义），改容器端口不用同步改这里
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/ping' % os.environ.get('PORT','8790'),timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
